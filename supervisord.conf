[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:backend]
directory=/app
command=/app/goodnight/.venv/bin/uvicorn goodnight.main:app --host 127.0.0.1 --port 8000 --workers 1 --no-access-log
user=goodnight
environment=HOME="/home/goodnight"
priority=10
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/app/goodnight/.venv/bin/python -m goodnight.proxy_process
priority=20
autostart=true
autorestart=true
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:wechat]
directory=/app
command=/app/goodnight/.venv/bin/python -m goodnight.yyb_process
user=goodnight
environment=HOME="/home/goodnight"
priority=5
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/null
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
