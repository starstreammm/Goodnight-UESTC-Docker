[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "goodnight-uestc-docker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3", "cryptography>=44,<47", "tzdata>=2025.1", "httpx>=0.28,<1", "uestc-login"]

[tool.setuptools.packages.find]
where = ["."]
include = ["goodnight*"]
[tool.pytest.ini_options]
pythonpath = [".", "../login", ".."]
testpaths = ["../tests"]

[tool.uv.sources]
uestc-login = { path = "../login", editable = true }

[dependency-groups]
dev = ["pytest>=8,<10"]
