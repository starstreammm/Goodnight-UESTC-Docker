[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "uestc-login"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx[brotli,zstd]>=0.28,<1", "cryptography>=44,<47"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["uestc_login*"]
